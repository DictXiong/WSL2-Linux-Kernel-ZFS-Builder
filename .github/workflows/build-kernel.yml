name: Build WSL2 Kernel with ZFS

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the build as a GitHub release
        required: true
        type: boolean
        default: true
  push:
    branches:
      - main
    paths:
      - versions.env
      - build.sh
      - scripts/gen_modules_vhdx.sh
      - .github/workflows/build-kernel.yml

concurrency:
  group: wsl-zfs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout builder
      uses: actions/checkout@v6

    - name: Reclaim runner disk space
      run: |
        docker system prune --all --force || true
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
        df -h

    - name: Build kernel
      id: build
      run: ./build.sh

    - name: Upload build artifacts
      uses: actions/upload-artifact@v6
      with:
        name: wsl-zfs-${{ steps.build.outputs.kernel_release }}
        path: |
          output/bzImage
          output/modules.vhdx
          output/build-manifest.txt
        compression-level: 9
        retention-days: 14

    - name: Publish release
      if: github.event_name == 'workflow_dispatch' && inputs.publish_release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.build.outputs.release_tag }}
        name: WSL ${{ steps.build.outputs.kernel_version }} + ${{ steps.build.outputs.zfs_ref }}
        body: |
          ## WSL2 kernel with OpenZFS

          - **Kernel release:** `${{ steps.build.outputs.kernel_release }}`
          - **WSL kernel source:** [`${{ steps.build.outputs.wsl_ref }}`](https://github.com/microsoft/WSL2-Linux-Kernel/commit/${{ steps.build.outputs.wsl_commit }})
          - **OpenZFS source:** [`${{ steps.build.outputs.zfs_ref }}`](https://github.com/openzfs/zfs/releases/tag/${{ steps.build.outputs.zfs_ref }}) ([commit](https://github.com/openzfs/zfs/commit/${{ steps.build.outputs.zfs_commit }}))

          ### Files

          - `bzImage` — custom WSL2 kernel; use it as the `.wslconfig` `kernel` file.
          - `modules.vhdx.zip` — compressed kernel modules disk; extract it before using the resulting `modules.vhdx` as the `.wslconfig` `kernelModules` file.
          - `build-manifest.txt` — exact source revisions used for this build.

          Built automatically by [GitHub Actions](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
        files: |
          output/bzImage
          output/modules.vhdx.zip
          output/build-manifest.txt
